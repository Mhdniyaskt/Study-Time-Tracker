<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Timer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1a1a1a;
      --bg-bar:    #111111;
      --bg-card:   #222222;
      --border:    rgba(255,255,255,0.07);
      --txt:       #f0f0f0;
      --txt-dim:   #666;
      --txt-sub:   #999;
      --accent:    #e86c3a;   /* Windows Clock orange */
      --green:     #4ade80;
      --amber:     #fbbf24;
      --radius:    10px;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--txt);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* ── Layout ─────────────────────────────────────────── */
    .root {
      display: flex;
      flex-direction: column;
      height: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    /* ── Title bar — the only draggable region ───────────── */
    .titlebar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px 6px;
      background: var(--bg-bar);
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;   /* OS-native drag, works outside app bounds */
      flex-shrink: 0;
    }

    .titlebar .subject {
      flex: 1;
      font-size: 11px;
      color: var(--txt-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      -webkit-app-region: drag;
    }

    /* All interactive elements inside the drag zone must opt-out */
    .titlebar button { -webkit-app-region: no-drag; }

    .icon-btn {
      width: 22px; height: 22px;
      background: transparent;
      border: none;
      border-radius: 4px;
      color: var(--txt-dim);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.1); color: var(--txt); }
    .icon-btn svg   { width: 13px; height: 13px; }

    .close-btn:hover { background: rgba(239,68,68,0.25); color: #f87171; }

    /* ── Clock body ───────────────────────────────────────── */
    .body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 14px 4px;
      gap: 0;
    }

    .time {
      font-size: clamp(28px, 8vw, 44px);
      font-weight: 300;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
      color: var(--txt);
      line-height: 1;
    }

    .time-labels {
      font-size: 9px;
      color: var(--txt-dim);
      letter-spacing: 0.5em;
      text-transform: uppercase;
      margin-top: 3px;
      /* align labels under hr / min / sec digits */
      width: 100%;
      text-align: center;
    }

    .status-line {
      font-size: 10px;
      min-height: 15px;
      margin-top: 6px;
      letter-spacing: 0.03em;
    }
    .status-line.ready   { color: var(--txt-dim); }
    .status-line.running { color: var(--green);   }
    .status-line.paused  { color: var(--amber);   }

    /* ── Controls ─────────────────────────────────────────── */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 8px 14px 12px;
      flex-shrink: 0;
    }

    .ctrl-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      transition: transform 0.12s, filter 0.12s;
      flex-shrink: 0;
    }
    .ctrl-btn:not(:disabled):hover  { transform: scale(1.1);  filter: brightness(1.15); }
    .ctrl-btn:not(:disabled):active { transform: scale(0.93); }
    .ctrl-btn:disabled { opacity: 0.25; cursor: default; }

    .btn-start  { background: var(--accent); color: #fff; }
    .btn-pause  { background: var(--accent); color: #fff; }
    .btn-resume { background: var(--green);  color: #111; }
    .btn-reset  { background: #2e2e2e;       color: var(--txt-sub); border: 1px solid var(--border); }

    .hidden { display: none !important; }

    /* Resize gripper hint — bottom-right corner */
    .gripper {
      position: absolute;
      bottom: 4px; right: 4px;
      width: 10px; height: 10px;
      opacity: 0.18;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="root">

    <!-- ── Title bar (drag handle) ── -->
    <div class="titlebar">
      <span class="subject" id="subjectLabel">📚 No subject</span>

      <!-- Restore main window -->
      <button class="icon-btn" id="restoreBtn" title="Go to Study Time Tracker" onclick="restoreMain()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M4 8V5a1 1 0 011-1h3M20 8V5a1 1 0 00-1-1h-3
                   M4 16v3a1 1 0 001 1h3M20 16v3a1 1 0 01-1 1h-3"/>
        </svg>
      </button>

      <!-- Close (hides widget; does NOT touch timer) -->
      <button class="icon-btn close-btn" title="Close widget (timer keeps running)" onclick="closeWidget()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- ── Clock ── -->
    <div class="body">
      <div class="time" id="clockFace">00:00:00</div>
      <div class="time-labels">hr &nbsp;&nbsp; min &nbsp;&nbsp; sec</div>
      <div class="status-line ready" id="statusLine">Ready</div>
    </div>

    <!-- ── Controls ── -->
    <div class="controls">
      <!-- Start (ready state) -->
      <button class="ctrl-btn btn-start" id="startBtn"
              title="Start" onclick="handleStart()">▶</button>

      <!-- Pause (running) -->
      <button class="ctrl-btn btn-pause hidden" id="pauseBtn"
              title="Pause" onclick="handlePause()">⏸</button>

      <!-- Resume (paused) -->
      <button class="ctrl-btn btn-resume hidden" id="resumeBtn"
              title="Resume" onclick="handleResume()">▶</button>

      <!-- Reset (always visible) -->
      <button class="ctrl-btn btn-reset" id="resetBtn"
              title="Reset" onclick="handleReset()">↻</button>
    </div>

  </div>

  <!-- resize gripper visual hint -->
  <svg class="gripper" viewBox="0 0 10 10" fill="white">
    <line x1="10" y1="0" x2="0" y2="10" stroke="white" stroke-width="1.5"/>
    <line x1="10" y1="4" x2="4" y2="10" stroke="white" stroke-width="1.5"/>
    <line x1="10" y1="8" x2="8" y2="10" stroke="white" stroke-width="1.5"/>
  </svg>

  <script>
    // ── Shared state received from the main process ────────────────────────
    let state = {
      state:          'ready',
      subject:        '',
      startTime:      null,
      elapsedSeconds: 0,
      isPaused:       false
    };

    // ── DOM refs ────────────────────────────────────────────────────────────
    const clockFace   = document.getElementById('clockFace');
    const statusLine  = document.getElementById('statusLine');
    const subjectLbl  = document.getElementById('subjectLabel');
    const startBtn    = document.getElementById('startBtn');
    const pauseBtn    = document.getElementById('pauseBtn');
    const resumeBtn   = document.getElementById('resumeBtn');
    const resetBtn    = document.getElementById('resetBtn');

    // ── Helpers ─────────────────────────────────────────────────────────────
    function fmt(s) {
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      return [h, m, sec].map(v => String(v).padStart(2, '0')).join(':');
    }

    function liveSeconds() {
      let t = state.elapsedSeconds;
      if (state.state === 'running' && !state.isPaused && state.startTime) {
        t += Math.floor((Date.now() - state.startTime) / 1000);
      }
      return t;
    }

    // ── Render ──────────────────────────────────────────────────────────────
    function render() {
      // Clock face
      clockFace.textContent = fmt(liveSeconds());

      // Subject label
      subjectLbl.textContent = state.subject
        ? '📚 ' + state.subject
        : '📚 No subject';

      // Status
      statusLine.className = 'status-line';
      if (state.state === 'running' && !state.isPaused) {
        statusLine.textContent = '● Running';
        statusLine.classList.add('running');
      } else if (state.state === 'paused' || state.isPaused) {
        statusLine.textContent = '⏸ Paused';
        statusLine.classList.add('paused');
      } else {
        statusLine.textContent = 'Ready';
        statusLine.classList.add('ready');
      }

      // Buttons — show only what makes sense for the current state
      startBtn.classList.toggle('hidden',  state.state !== 'ready');
      pauseBtn.classList.toggle('hidden',  !(state.state === 'running' && !state.isPaused));
      resumeBtn.classList.toggle('hidden', !(state.state === 'paused'  || state.isPaused));
      resetBtn.disabled = false;
    }

    // ── Live tick ───────────────────────────────────────────────────────────
    setInterval(() => {
      if (state.state === 'running' && !state.isPaused) render();
    }, 250);

    // ── IPC: receive timer state broadcasts ─────────────────────────────────
    window.electronAPI.onTimerState((newState) => {
      state = newState;
      render();
    });

    // Request current state on load
    window.electronAPI.requestTimerState();

    // ── Control handlers ────────────────────────────────────────────────────

    function handleStart() {
      // Start requires a subject — delegate to the main window if none set
      if (!state.subject) {
        // Open main window so user can type a subject, then start
        window.electronAPI.focusMainWindow();
        return;
      }
      window.electronAPI.sendTimerAction('start', { subject: state.subject });
    }

    function handlePause()  { window.electronAPI.sendTimerAction('pause');  }
    function handleResume() { window.electronAPI.sendTimerAction('resume'); }

    function handleReset() {
      if (state.state === 'running' && !state.isPaused) {
        if (!confirm('Reset the running timer? Current time will be lost.')) return;
      }
      window.electronAPI.sendTimerAction('reset');
    }

    function closeWidget()  { window.electronAPI.closeFloatingWidget(); }
    function restoreMain()  { window.electronAPI.focusMainWindow();     }
  </script>
</body>
</html>
