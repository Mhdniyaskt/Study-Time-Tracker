<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Timer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #1a1a1a;
      color: #ffffff;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    .container {
      width: 280px;
      padding: 16px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2a2a2a 0%, #1f1f1f 100%);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      -webkit-app-region: no-drag;
    }

    .subject {
      font-size: 13px;
      color: #a0a0a0;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 8px;
    }

    .subject-icon {
      font-size: 14px;
      margin-right: 6px;
    }

    .close-btn {
      width: 24px;
      height: 24px;
      border: none;
      background: transparent;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .close-btn:hover {
      background: #333;
      color: #fff;
    }

    .timer-display {
      text-align: center;
      margin: 20px 0;
    }

    .time {
      font-size: 42px;
      font-weight: 300;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin-bottom: 4px;
    }

    .time-labels {
      font-size: 9px;
      color: #666;
      letter-spacing: 8px;
      text-transform: uppercase;
    }

    .status {
      text-align: center;
      font-size: 11px;
      color: #888;
      margin-bottom: 16px;
      min-height: 14px;
    }

    .status.running {
      color: #4ade80;
    }

    .status.paused {
      color: #fbbf24;
    }

    .status.stopped {
      color: #f87171;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 16px;
      -webkit-app-region: no-drag;
    }

    .control-btn {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.2s;
      position: relative;
    }

    .control-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .control-btn:not(:disabled):hover {
      transform: scale(1.05);
    }

    .control-btn:not(:disabled):active {
      transform: scale(0.95);
    }

    .pause-btn {
      background: #fbbf24;
      color: #1a1a1a;
    }

    .pause-btn:not(:disabled):hover {
      background: #fcd34d;
    }

    .resume-btn {
      background: #4ade80;
      color: #1a1a1a;
    }

    .resume-btn:not(:disabled):hover {
      background: #6ee7b7;
    }

    .stop-btn {
      background: #ef4444;
      color: #ffffff;
    }

    .stop-btn:not(:disabled):hover {
      background: #f87171;
    }

    .tooltip {
      position: absolute;
      bottom: -24px;
      left: 50%;
      transform: translateX(-50%);
      background: #000;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .control-btn:hover .tooltip {
      opacity: 1;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="subject">
        <span class="subject-icon">📚</span>
        <span id="subjectText">No subject</span>
      </div>
      <button class="close-btn" onclick="closeWidget()" title="Hide widget">×</button>
    </div>

    <div class="timer-display">
      <div class="time" id="timerDisplay">00:00:00</div>
      <div class="time-labels">hr   min   sec</div>
    </div>

    <div class="status" id="statusText">Ready</div>

    <div class="controls">
      <button id="pauseBtn" class="control-btn pause-btn hidden" onclick="handlePause()" title="Pause timer">
        <span>⏸</span>
      </button>
      
      <button id="resumeBtn" class="control-btn resume-btn hidden" onclick="handleResume()" title="Resume timer">
        <span>▶</span>
      </button>
      
      <button id="stopBtn" class="control-btn stop-btn" onclick="handleStop()" title="Stop & Save">
        <span>■</span>
      </button>
    </div>
  </div>

  <script>
    let currentState = {
      state: 'ready',
      subject: '',
      startTime: null,
      elapsedSeconds: 0,
      isPaused: false
    };

    // Format seconds as HH:MM:SS
    function formatTime(totalSeconds) {
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      return [hours, minutes, seconds]
        .map(v => String(v).padStart(2, '0'))
        .join(':');
    }

    // Update UI based on current state
    function updateUI() {
      const { state, subject, elapsedSeconds, isPaused } = currentState;
      
      // Update subject
      document.getElementById('subjectText').textContent = subject || 'No subject';
      
      // Update timer display
      let displaySeconds = elapsedSeconds;
      if (state === 'running' && !isPaused && currentState.startTime) {
        const now = Date.now();
        const additionalSeconds = Math.floor((now - currentState.startTime) / 1000);
        displaySeconds = elapsedSeconds + additionalSeconds;
      }
      document.getElementById('timerDisplay').textContent = formatTime(displaySeconds);
      
      // Update status
      const statusEl = document.getElementById('statusText');
      if (state === 'ready') {
        statusEl.textContent = 'Ready';
        statusEl.className = 'status';
      } else if (state === 'running') {
        if (isPaused) {
          statusEl.textContent = 'Paused';
          statusEl.className = 'status paused';
        } else {
          statusEl.textContent = 'Running ●';
          statusEl.className = 'status running';
        }
      } else if (state === 'stopped') {
        statusEl.textContent = 'Stopped';
        statusEl.className = 'status stopped';
      }
      
      // Update button visibility
      const pauseBtn = document.getElementById('pauseBtn');
      const resumeBtn = document.getElementById('resumeBtn');
      const stopBtn = document.getElementById('stopBtn');
      
      if (state === 'running') {
        if (isPaused) {
          pauseBtn.classList.add('hidden');
          resumeBtn.classList.remove('hidden');
          stopBtn.disabled = false;
        } else {
          pauseBtn.classList.remove('hidden');
          resumeBtn.classList.add('hidden');
          stopBtn.disabled = false;
        }
      } else {
        pauseBtn.classList.add('hidden');
        resumeBtn.classList.add('hidden');
        stopBtn.disabled = true;
      }
    }

    // Handle incoming timer state updates
    window.electronAPI.onTimerState((state) => {
      currentState = state;
      updateUI();
    });

    // Request initial state
    window.electronAPI.requestTimerState();

    // Update display every 250ms when running
    setInterval(() => {
      if (currentState.state === 'running' && !currentState.isPaused) {
        updateUI();
      }
    }, 250);

    // Control actions
    function handlePause() {
      window.electronAPI.sendTimerAction('pause');
    }

    function handleResume() {
      window.electronAPI.sendTimerAction('resume');
    }

    function handleStop() {
      if (confirm('Stop and save this study session?')) {
        window.electronAPI.sendTimerAction('stop-and-save');
      }
    }

    function closeWidget() {
      window.electronAPI.closeFloatingWidget();
    }
  </script>
</body>
</html>
