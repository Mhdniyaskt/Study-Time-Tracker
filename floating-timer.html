<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Timer</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #121316;
      --bg-bar: #18191e;
      --bg-btn-neutral: #22242a;
      --bg-btn-neutral-hover: #2c2f37;
      --border: rgba(255, 255, 255, 0.08);
      --border-subtle: rgba(255, 255, 255, 0.05);
      --txt-primary: #f1f5f9;
      --txt-muted: #94a3b8;
      --txt-dim: #64748b;
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --accent-amber: #f59e0b;
      --accent-amber-hover: #d97706;
      --radius: 12px;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--txt-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Container */
    .widget-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg);
    }

    /* Top bar / Draggable handle */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 34px;
      padding: 0 10px;
      background: var(--bg-bar);
      border-bottom: 1px solid var(--border-subtle);
      -webkit-app-region: drag;
      cursor: grab;
      flex-shrink: 0;
    }

    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
      -webkit-app-region: drag;
    }

    .subject-text {
      font-size: 11px;
      font-weight: 500;
      color: var(--txt-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      -webkit-app-region: drag;
    }

    .titlebar-right {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    /* Status dot in titlebar */
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--txt-dim);
      transition: background 0.2s ease;
    }
    .status-dot.running {
      background: var(--accent-green);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }
    .status-dot.paused {
      background: var(--accent-amber);
    }

    .titlebar button {
      -webkit-app-region: no-drag;
      cursor: pointer;
    }

    .icon-btn {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      border: none;
      background: transparent;
      color: var(--txt-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--txt-primary);
    }
    .icon-btn svg {
      width: 12px;
      height: 12px;
    }
    .close-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    /* Widget Body */
    .widget-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 14px 2px;
    }

    .timer-digits {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      font-size: clamp(28px, 9vw, 36px);
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--txt-primary);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      color: var(--txt-dim);
      margin-top: 4px;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.03);
      transition: all 0.2s ease;
    }
    .status-badge.running {
      color: var(--accent-green);
      background: rgba(16, 185, 129, 0.1);
    }
    .status-badge.paused {
      color: var(--accent-amber);
      background: rgba(245, 158, 11, 0.1);
    }

    /* Action Controls */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px 14px 12px;
      flex-shrink: 0;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.12s ease;
      min-width: 82px;
      height: 32px;
    }
    .btn-action:active {
      transform: scale(0.97);
    }
    .btn-action:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    .btn-start {
      background: var(--accent-green);
      color: #ffffff;
    }
    .btn-start:hover:not(:disabled) {
      background: var(--accent-green-hover);
    }

    .btn-pause {
      background: var(--accent-amber);
      color: #ffffff;
    }
    .btn-pause:hover:not(:disabled) {
      background: var(--accent-amber-hover);
    }

    .btn-resume {
      background: var(--accent-green);
      color: #ffffff;
    }
    .btn-resume:hover:not(:disabled) {
      background: var(--accent-green-hover);
    }

    .btn-reset {
      background: var(--bg-btn-neutral);
      color: var(--txt-muted);
      border-color: var(--border);
    }
    .btn-reset:hover:not(:disabled) {
      background: var(--bg-btn-neutral-hover);
      color: var(--txt-primary);
    }

    .hidden {
      display: none !important;
    }

    /* Corner resize hint */
    .resize-hint {
      position: absolute;
      bottom: 3px;
      right: 3px;
      width: 8px;
      height: 8px;
      pointer-events: none;
      opacity: 0.2;
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <!-- Top Bar: Subject and Window Controls -->
    <div class="titlebar" id="titlebar">
      <div class="titlebar-left">
        <span class="subject-text" id="subjectLabel">📚 No subject</span>
      </div>
      <div class="titlebar-right">
        <!-- Status dot -->
        <span class="status-dot" id="statusDot" title="Status"></span>

        <!-- Restore / Focus Main Window -->
        <button class="icon-btn" id="restoreBtn" title="Open Main Window" onclick="restoreMain()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V5a1 1 0 011-1h3M20 8V5a1 1 0 00-1-1h-3M4 16v3a1 1 0 001 1h3M20 16v3a1 1 0 01-1 1h-3"/>
          </svg>
        </button>

        <!-- Hide / Close Widget (timer keeps running) -->
        <button class="icon-btn close-btn" title="Hide Widget (timer keeps running)" onclick="closeWidget()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Clock Display -->
    <div class="widget-body" onclick="restoreMain()" style="cursor: pointer;" title="Click to view main timer">
      <div class="timer-digits" id="timerClock">00:00:00</div>
      <div class="status-badge" id="statusBadge">Ready</div>
    </div>

    <!-- Control Buttons -->
    <div class="controls-row">
      <!-- Start Button (Ready state) -->
      <button class="btn-action btn-start" id="startBtn" onclick="handleStart()">
        <span>▶</span>
        <span>Start</span>
      </button>

      <!-- Pause Button (Running state) -->
      <button class="btn-action btn-pause hidden" id="pauseBtn" onclick="handlePause()">
        <span>⏸</span>
        <span>Pause</span>
      </button>

      <!-- Resume Button (Paused state) -->
      <button class="btn-action btn-resume hidden" id="resumeBtn" onclick="handleResume()">
        <span>▶</span>
        <span>Resume</span>
      </button>

      <!-- Reset Button -->
      <button class="btn-action btn-reset" id="resetBtn" onclick="handleReset()">
        <span>↻</span>
        <span>Reset</span>
      </button>
    </div>
  </div>

  <svg class="resize-hint" viewBox="0 0 8 8" fill="white">
    <line x1="8" y1="2" x2="2" y2="8" stroke="white" stroke-width="1.2"/>
    <line x1="8" y1="5" x2="5" y2="8" stroke="white" stroke-width="1.2"/>
  </svg>

  <script>
    // Shared timer state
    let state = {
      state: 'ready',
      subject: '',
      startTime: null,
      elapsedSeconds: 0,
      durationSeconds: 0,
      isPaused: false
    };

    const timerClock  = document.getElementById('timerClock');
    const statusBadge = document.getElementById('statusBadge');
    const statusDot   = document.getElementById('statusDot');
    const subjectLbl  = document.getElementById('subjectLabel');
    const startBtn    = document.getElementById('startBtn');
    const pauseBtn    = document.getElementById('pauseBtn');
    const resumeBtn   = document.getElementById('resumeBtn');
    const resetBtn    = document.getElementById('resetBtn');

    function formatTime(totalSeconds) {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
    }

    function getLiveSeconds() {
      const base = state.durationSeconds ?? state.elapsedSeconds ?? 0;
      if (state.state === 'running' && !state.isPaused && state.startTime) {
        return base + Math.floor((Date.now() - state.startTime) / 1000);
      }
      return base;
    }

    function render() {
      // Clock
      timerClock.textContent = formatTime(getLiveSeconds());

      // Subject
      const trimmed = (state.subject || '').trim();
      subjectLbl.textContent = trimmed ? `📚 ${trimmed}` : '📚 No subject';

      // Status
      statusBadge.className = 'status-badge';
      statusDot.className = 'status-dot';

      if (state.state === 'running' && !state.isPaused) {
        statusBadge.textContent = 'Studying';
        statusBadge.classList.add('running');
        statusDot.classList.add('running');
      } else if (state.state === 'paused' || state.isPaused) {
        statusBadge.textContent = 'Paused';
        statusBadge.classList.add('paused');
        statusDot.classList.add('paused');
      } else {
        statusBadge.textContent = 'Ready';
      }

      // Buttons
      startBtn.classList.toggle('hidden', state.state !== 'ready');
      pauseBtn.classList.toggle('hidden', !(state.state === 'running' && !state.isPaused));
      resumeBtn.classList.toggle('hidden', !(state.state === 'paused' || state.isPaused));

      const isReadyEmpty = state.state === 'ready' && getLiveSeconds() === 0 && !trimmed;
      resetBtn.disabled = isReadyEmpty;
    }

    // Live ticker (100ms for smooth sync)
    setInterval(() => {
      if (state.state === 'running' && !state.isPaused) {
        render();
      }
    }, 100);

    // IPC: Listen for state updates
    if (window.electronAPI) {
      window.electronAPI.onTimerState((newState) => {
        state = newState;
        render();
      });

      // Request initial state on load
      window.electronAPI.requestTimerState();
    }

    // Actions
    function handleStart() {
      const trimmed = (state.subject || '').trim();
      if (!trimmed) {
        // Prompt user by focusing main window
        if (window.electronAPI) {
          window.electronAPI.focusMainWindow();
        }
        return;
      }
      if (window.electronAPI) {
        window.electronAPI.sendTimerAction('start', { subject: trimmed });
      }
    }

    function handlePause() {
      if (window.electronAPI) {
        window.electronAPI.sendTimerAction('pause');
      }
    }

    function handleResume() {
      if (window.electronAPI) {
        window.electronAPI.sendTimerAction('resume');
      }
    }

    function handleReset() {
      const live = getLiveSeconds();
      if (state.state === 'running' || (state.state === 'paused' && live > 0)) {
        if (!confirm('Reset timer to 00:00:00? Unsaved study time will be cleared.')) {
          return;
        }
      }
      if (window.electronAPI) {
        window.electronAPI.sendTimerAction('reset');
      }
    }

    function closeWidget() {
      if (window.electronAPI) {
        window.electronAPI.closeFloatingWidget();
      }
    }

    function restoreMain() {
      if (window.electronAPI) {
        window.electronAPI.focusMainWindow();
      }
    }
  </script>
</body>
</html>
