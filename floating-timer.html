<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Timer</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #121316;
      --bg-bar: #18191e;
      --bg-btn-neutral: #22242a;
      --bg-btn-neutral-hover: #2c2f37;
      --border: rgba(255, 255, 255, 0.08);
      --border-subtle: rgba(255, 255, 255, 0.05);
      --txt-primary: #f1f5f9;
      --txt-muted: #94a3b8;
      --txt-dim: #64748b;
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --accent-amber: #f59e0b;
      --accent-amber-hover: #d97706;
      --accent-purple: #a855f7;
      --radius: 12px;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--txt-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Container */
    .widget-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg);
    }

    /* Top bar / Draggable handle */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 34px;
      padding: 0 10px;
      background: var(--bg-bar);
      border-bottom: 1px solid var(--border-subtle);
      -webkit-app-region: drag;
      cursor: grab;
      flex-shrink: 0;
    }

    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
      -webkit-app-region: drag;
    }

    .subject-text {
      font-size: 11px;
      font-weight: 500;
      color: var(--txt-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      -webkit-app-region: drag;
    }

    .titlebar-right {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    /* Mode pill button in titlebar */
    .mode-toggle {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: var(--txt-muted);
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: background 0.15s, color 0.15s;
    }
    .mode-toggle:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--txt-primary);
    }
    .mode-toggle.focus-active {
      color: #818cf8;
      border-color: rgba(129, 140, 248, 0.3);
      background: rgba(99, 102, 241, 0.15);
    }

    /* Status dot in titlebar */
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--txt-dim);
      transition: background 0.2s ease;
    }
    .status-dot.running {
      background: var(--accent-green);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }
    .status-dot.paused {
      background: var(--accent-amber);
    }
    .status-dot.break {
      background: var(--accent-purple);
      box-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
    }

    .titlebar button {
      -webkit-app-region: no-drag;
      cursor: pointer;
    }

    .icon-btn {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: var(--txt-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--txt-primary);
    }
    .icon-btn svg {
      width: 11px;
      height: 11px;
    }
    .close-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    /* Widget Body */
    .widget-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 14px 2px;
    }

    .timer-digits {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      font-size: clamp(26px, 8.5vw, 34px);
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--txt-primary);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .status-badge-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--txt-dim);
      transition: color 0.2s, background 0.2s;
    }
    .status-badge.running {
      color: var(--accent-green);
      background: rgba(16, 185, 129, 0.12);
    }
    .status-badge.paused {
      color: var(--accent-amber);
      background: rgba(245, 158, 11, 0.12);
    }
    .status-badge.break {
      color: var(--accent-purple);
      background: rgba(168, 85, 247, 0.15);
    }

    .round-badge {
      font-size: 10px;
      font-weight: 500;
      color: var(--txt-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Widget Controls */
    .widget-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 10px 10px;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 30px;
      padding: 0 10px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.15s, opacity 0.15s, transform 0.08s;
      white-space: nowrap;
    }
    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--accent-green);
      color: #ffffff;
      flex: 1;
    }
    .btn-primary:hover {
      background: var(--accent-green-hover);
    }

    .btn-warning {
      background: var(--accent-amber);
      color: #ffffff;
      flex: 1;
    }
    .btn-warning:hover {
      background: var(--accent-amber-hover);
    }

    .btn-purple {
      background: var(--accent-purple);
      color: #ffffff;
      flex: 1;
    }
    .btn-purple:hover {
      background: #9333ea;
    }

    .btn-neutral {
      background: var(--bg-btn-neutral);
      color: var(--txt-muted);
      border: 1px solid var(--border);
    }
    .btn-neutral:hover:not(:disabled) {
      background: var(--bg-btn-neutral-hover);
      color: var(--txt-primary);
    }
    .btn-neutral:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <!-- Titlebar / Drag Handle -->
    <div class="titlebar">
      <div class="titlebar-left">
        <span class="status-dot" id="statusDot"></span>
        <span class="subject-text" id="subjectLbl">📚 No subject</span>
      </div>
      <div class="titlebar-right">
        <!-- Mode Switcher -->
        <button class="mode-toggle" id="modeToggleBtn" title="Switch Timer Mode">FREE</button>

        <!-- Focus Main Window -->
        <button class="icon-btn" id="restoreBtn" title="Restore Main Window" onclick="restoreMain()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V5a1 1 0 011-1h3M20 8V5a1 1 0 00-1-1h-3M4 16v3a1 1 0 001 1h3M20 16v3a1 1 0 01-1 1h-3" />
          </svg>
        </button>

        <!-- Close Widget -->
        <button class="icon-btn close-btn" title="Close Widget" onclick="closeWidget()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Body -->
    <div class="widget-body">
      <div class="timer-digits" id="timerClock">00:00</div>
      <div class="status-badge-row">
        <span class="status-badge" id="statusBadge">Ready</span>
        <span class="round-badge hidden" id="roundBadge">R 1/4</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="widget-controls">
      <button class="btn btn-primary" id="startBtn" onclick="handleStart()">▶ Start</button>
      <button class="btn btn-warning hidden" id="pauseBtn" onclick="handlePause()">⏸ Pause</button>
      <button class="btn btn-primary hidden" id="resumeBtn" onclick="handleResume()">▶ Resume</button>
      <button class="btn btn-purple hidden" id="skipBreakBtn" onclick="handleSkipBreak()">⏭ Skip</button>
      <button class="btn btn-neutral" id="resetBtn" onclick="handleReset()">↻ Reset</button>
    </div>
  </div>

  <script>
    let state = {
      mode: 'free',
      state: 'ready',
      subject: '',
      startTime: null,
      elapsedSeconds: 0,
      durationSeconds: 0,
      isPaused: false,
      phase: 'focus',
      round: 1,
      totalRounds: 4,
      remainingSeconds: 25 * 60,
      totalPhaseSeconds: 25 * 60,
    };

    const timerClock    = document.getElementById('timerClock');
    const subjectLbl    = document.getElementById('subjectLbl');
    const statusBadge   = document.getElementById('statusBadge');
    const statusDot     = document.getElementById('statusDot');
    const roundBadge    = document.getElementById('roundBadge');
    const modeToggleBtn = document.getElementById('modeToggleBtn');
    const startBtn      = document.getElementById('startBtn');
    const pauseBtn      = document.getElementById('pauseBtn');
    const resumeBtn     = document.getElementById('resumeBtn');
    const skipBreakBtn  = document.getElementById('skipBreakBtn');
    const resetBtn      = document.getElementById('resetBtn');

    function formatTime(totalSeconds) {
      const s = Math.max(0, Math.floor(totalSeconds));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      return [h, m, sec].map(v => String(v).padStart(2, '0')).join(':');
    }

    function getLiveSeconds() {
      if (state.mode === 'focus') {
        const total = state.totalPhaseSeconds || 25 * 60;
        let elapsed = state.elapsedSeconds || 0;
        if (state.state === 'running' && !state.isPaused && state.startTime) {
          elapsed += Math.floor((Date.now() - state.startTime) / 1000);
        }
        return Math.max(0, total - elapsed);
      } else {
        const base = state.durationSeconds ?? state.elapsedSeconds ?? 0;
        if (state.state === 'running' && !state.isPaused && state.startTime) {
          return base + Math.floor((Date.now() - state.startTime) / 1000);
        }
        return base;
      }
    }

    function render() {
      const isFocus = state.mode === 'focus';
      const live = getLiveSeconds();

      // Clock
      timerClock.textContent = formatTime(live);

      // Mode Toggle button text
      modeToggleBtn.textContent = isFocus ? 'FOCUS' : 'FREE';
      modeToggleBtn.classList.toggle('focus-active', isFocus);

      // Subject
      const trimmed = (state.subject || '').trim();
      subjectLbl.textContent = trimmed ? `📚 ${trimmed}` : '📚 No subject';

      // Status & Round Badges
      statusBadge.className = 'status-badge';
      statusDot.className = 'status-dot';

      if (isFocus) {
        roundBadge.classList.remove('hidden');
        roundBadge.textContent = `R ${state.round || 1}/${state.totalRounds || 4}`;

        const isBreak = state.phase === 'shortBreak' || state.phase === 'longBreak';

        if (state.state === 'running' && !state.isPaused) {
          if (isBreak) {
            statusBadge.textContent = state.phase === 'longBreak' ? 'Long Break' : 'Break';
            statusBadge.classList.add('break');
            statusDot.classList.add('break');
          } else {
            statusBadge.textContent = 'Focusing';
            statusBadge.classList.add('running');
            statusDot.classList.add('running');
          }
        } else if (state.state === 'paused' || state.isPaused) {
          statusBadge.textContent = isBreak ? 'Break Paused' : 'Paused';
          statusBadge.classList.add('paused');
          statusDot.classList.add('paused');
        } else {
          statusBadge.textContent = isBreak ? 'Break Ready' : 'Ready';
        }
      } else {
        roundBadge.classList.add('hidden');
        if (state.state === 'running' && !state.isPaused) {
          statusBadge.textContent = 'Studying';
          statusBadge.classList.add('running');
          statusDot.classList.add('running');
        } else if (state.state === 'paused' || state.isPaused) {
          statusBadge.textContent = 'Paused';
          statusBadge.classList.add('paused');
          statusDot.classList.add('paused');
        } else {
          statusBadge.textContent = 'Ready';
        }
      }

      // Buttons
      const isRunning = state.state === 'running' && !state.isPaused;
      const isPaused = state.state === 'paused' || state.isPaused;
      const isBreakPhase = isFocus && (state.phase === 'shortBreak' || state.phase === 'longBreak');

      startBtn.classList.toggle('hidden', state.state !== 'ready');
      pauseBtn.classList.toggle('hidden', !isRunning);
      resumeBtn.classList.toggle('hidden', !isPaused);
      skipBreakBtn.classList.toggle('hidden', !isBreakPhase);

      const isReadyEmpty = state.state === 'ready' && !trimmed;
      resetBtn.disabled = isReadyEmpty && (!isFocus || state.phase === 'focus');
    }

    // Ticker (100ms)
    setInterval(() => {
      if (state.state === 'running' && !state.isPaused) {
        render();
      }
    }, 100);

    // IPC: Listen for state updates
    if (window.electronAPI) {
      window.electronAPI.onTimerState((newState) => {
        state = { ...state, ...newState };
        render();
      });
      window.electronAPI.requestTimerState();
    }

    modeToggleBtn.addEventListener('click', () => {
      const nextMode = state.mode === 'focus' ? 'free' : 'focus';
      if (window.electronAPI) {
        window.electronAPI.sendTimerAction('switch-mode', { mode: nextMode });
      }
    });

    function handleStart() {
      const trimmed = (state.subject || '').trim();
      if (!trimmed && (!state.mode || state.mode !== 'focus' || state.phase === 'focus')) {
        if (window.electronAPI) {
          window.electronAPI.focusMainWindow();
        }
        return;
      }
      if (window.electronAPI) {
        window.electronAPI.sendTimerAction('start', { subject: trimmed });
      }
    }

    function handlePause() {
      if (window.electronAPI) {
        window.electronAPI.sendTimerAction('pause');
      }
    }

    function handleResume() {
      if (window.electronAPI) {
        window.electronAPI.sendTimerAction('resume');
      }
    }

    function handleSkipBreak() {
      if (window.electronAPI) {
        window.electronAPI.sendTimerAction('skip-break');
      }
    }

    function handleReset() {
      const live = getLiveSeconds();
      if (state.state === 'running' || (state.state === 'paused' && live > 0)) {
        if (!confirm('Reset timer? Progress will be cleared.')) {
          return;
        }
      }
      if (window.electronAPI) {
        window.electronAPI.sendTimerAction('reset');
      }
    }

    function closeWidget() {
      if (window.electronAPI) {
        window.electronAPI.closeFloatingWidget();
      }
    }

    function restoreMain() {
      if (window.electronAPI) {
        window.electronAPI.focusMainWindow();
      }
    }
  </script>
</body>
</html>
